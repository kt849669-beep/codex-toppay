  <body>
    <div class="login-container">
      <h1 class="header">LOG IN</h1>

      <form id="loginForm">
        <div class="form-group">
          <i data-lucide="phone" class="input-icon"></i>
          <input
            type="tel"
            id="mobile"
            class="form-control"
            placeholder="Enter Your Phone Number"
            maxlength="10"
            required
          />
        </div>

        <div class="form-group">
          <i data-lucide="lock" class="input-icon"></i>
          <input
            type="text"
            id="password"
            class="form-control"
            placeholder="Enter Password"
            required
          />
        </div>

        <div class="forgot-password">
          <a rel="nofollow noopener">Forget Password</a>
        </div>

        <div
          id="errorMessage"
          class="hidden"
          style="
            color: red;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
          "
        ></div>

        <div class="login-btn-container">
          <button type="submit" class="btn-primary" id="loginBtn">
            LOG IN
          </button>
        </div>

      </form>
    </div>


    <div class="mpin-overlay" id="mpinOverlay" aria-hidden="true">
      <section class="mpin-sheet" role="dialog" aria-modal="true" aria-labelledby="mpinTitle">
        <h2 id="mpinTitle">Please enter MPIN verification</h2>
        <p>Enter your 6-digit MPIN to continue</p>

        <div class="mpin-digits" id="mpinDigits" aria-label="Six digit MPIN">
          <span class="mpin-digit active"></span>
          <span class="mpin-digit"></span>
          <span class="mpin-digit"></span>
          <span class="mpin-digit"></span>
          <span class="mpin-digit"></span>
          <span class="mpin-digit"></span>
        </div>

        <div class="mpin-keypad" aria-label="MPIN keypad">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <div></div>
          <button type="button" data-key="0">0</button>
          <button type="button" class="key-action key-delete" data-action="delete" aria-label="Delete last digit">⌫</button>
        </div>
      </section>
    </div>
